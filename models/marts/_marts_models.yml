version: 2

models:

  - name: dim_date
    description: >
      Month-end calendar. One row per month-end (grain: month_end_date), covering every month in the facts.
      Filter reports on is_reporting_month.
    columns:
      - name: month_end_date
        description: "Last day of the month (primary key)."
        data_tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year."
      - name: year_month
        description: "Year and month label, e.g. 2021-12."
      - name: is_reporting_month
        description: >
          True for month-ends 2019-01 to 2022-11. Before 2019 periods that expired earlier are missing from the extract
          (MRR ramp-up); from 2022-12 renewals expiring after 2023 are missing (run-off).
        data_tests:
          - not_null

  - name: dim_customer
    description: "One row per customer (grain: customer_id), including customers without paid MRR."
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_customers')
    columns:
      - name: customer_id
        description: "Customer identifier (primary key)."
        data_tests:
          - unique
          - not_null
      - name: customer_country
        description: "Customer country (NULL when unknown)."
      - name: customer_segment
        description: "Customer segment."
      - name: join_date
        description: "Date the customer joined."
      - name: first_paid_month
        description: >
          First month-end with paid MRR in the extract (NULL for customers who never paid). Because the extract starts
          in 2018, this is not always the real start of the relationship (see is_new_logo in fct_customer_monthly).

  - name: dim_product
    description: "One row per product (grain: product_id) with its name, subcategory and category."
    columns:
      - name: product_id
        description: "Product identifier (primary key)."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Product name."
      - name: product_subcategory
        description: "Product subcategory."
      - name: product_category
        description: "Product category."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Domains', 'Hosting', 'Applications', 'Other']

  - name: fct_mrr_monthly
    description: >
      Paid MRR and MRR movements per customer x product x month-end (grain: customer_id, product_id, month_end_date).
      One row per month with paid MRR, plus a churn row (mrr_eur = 0) in the first month without paid MRR.
      All months are kept; filter on dim_date.is_reporting_month. Used for category performance.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['customer_id', 'product_id', 'month_end_date']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "mrr_eur > 0 or opening_mrr_eur > 0"
    columns:
      - name: customer_id
        description: "Customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        description: "Product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: month_end_date
        description: "Month-end of the snapshot."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date
      - name: mrr_eur
        description: "Paid MRR at this month-end (closing MRR). 0 on churn rows."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: opening_mrr_eur
        description: "Paid MRR at the previous month-end (opening MRR)."
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: movement_type
        description: >
          new (first paid month of this customer x product), reactivation (paid again after a gap),
          churn (paid last month, not this month), expansion, contraction, unchanged.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'expansion', 'contraction', 'churn', 'reactivation', 'unchanged']
      - name: new_mrr_eur
        description: "MRR added by a new movement (positive)."
      - name: expansion_mrr_eur
        description: "MRR added by an expansion (positive)."
      - name: reactivation_mrr_eur
        description: "MRR added by a reactivation (positive)."
      - name: contraction_mrr_eur
        description: "MRR lost by a contraction (positive)."
      - name: churn_mrr_eur
        description: "MRR lost by a churn (positive)."

  - name: fct_customer_monthly
    description: >
      Paid MRR, movements and KPI flags per customer x month-end (grain: customer_id, month_end_date).
      One row per month with paid MRR, plus a churn row (mrr_eur = 0) in the first month without paid MRR.
      All months are kept; filter on dim_date.is_reporting_month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['customer_id', 'month_end_date']
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_active = (mrr_eur > 0)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_cross_sold = (paid_category_count > 1)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_churned or movement_type = 'churn'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "not is_churn_contradicted_by_subscription or movement_type = 'churn'"
    columns:
      - name: customer_id
        description: "Customer."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: month_end_date
        description: "Month-end of the snapshot."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date
      - name: mrr_eur
        description: "Paid MRR of the customer at this month-end (closing MRR). 0 on churn rows."
        data_tests:
          - not_null
      - name: opening_mrr_eur
        description: "Paid MRR at the previous month-end (opening MRR)."
        data_tests:
          - not_null
      - name: movement_type
        description: >
          Customer-level movement on total paid MRR: new (first paid month), reactivation, churn (first month-end
          without paid MRR), expansion, contraction, unchanged. Used for the MRR bridge.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['new', 'expansion', 'contraction', 'churn', 'reactivation', 'unchanged']
      - name: new_mrr_eur
        description: "MRR added by a new customer (positive)."
      - name: expansion_mrr_eur
        description: "MRR added by an expansion (positive)."
      - name: reactivation_mrr_eur
        description: "MRR added by a reactivation (positive)."
      - name: contraction_mrr_eur
        description: "MRR lost by a contraction (positive)."
      - name: churn_mrr_eur
        description: "MRR lost by a churn (positive)."
      - name: is_active
        description: "True when the customer has paid MRR at this month-end (KPI 7)."
        data_tests:
          - not_null
      - name: is_new_logo
        description: >
          True in the first paid month when the customer joined within 12 months of it (KPI 8). About 70% of customers
          with a first paid month in the reporting window joined more than 13 months earlier; their earlier history is
          outside the extract, so they are not counted as new logos.
        data_tests:
          - not_null
      - name: is_churned
        description: >
          True on a churn row when the customer is not paying again at the next month-end (1-month grace period, KPI 6).
          A customer back within one month is not counted as churned.
        data_tests:
          - not_null
      - name: is_churn_contradicted_by_subscription
        description: >
          True on churn rows where the customer still holds a paid subscription that started on or before and expires
          after the churn month, excluding Cancelled, Suspended, To delete, Lost and Unpaid statuses. The order for that
          period is most likely missing from the extract. Used for the adjusted churn rate; churn logic is unchanged.
        data_tests:
          - not_null
      - name: paid_category_count
        description: "Number of distinct paid product categories at this month-end (placeholder products excluded)."
        data_tests:
          - not_null
      - name: is_cross_sold
        description: "True when the customer has paid MRR in more than one product category (KPI 10)."
        data_tests:
          - not_null

  - name: rpt_kpi_monthly
    description: >
      KPI framework: one row per reporting month (grain: month_end_date, 47 rows) with the 10 KPIs, the adjusted churn
      rate and the MRR bridge. Churn, NRR and GRR levels are affected by order lines missing from the extract (see
      docs/kpi_framework.md): trends are reliable, measured churn is an upper bound and retention a lower bound.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "gross_revenue_retention_pct <= net_revenue_retention_pct + 0.000001"
          config:
            where: "net_revenue_retention_pct is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (mrr_growth_yoy_pct is null) = (net_revenue_retention_pct is null)
              and (net_revenue_retention_pct is null) = (gross_revenue_retention_pct is null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "adjusted_churn_rate_pct <= customer_churn_rate_pct"
    columns:
      - name: month_end_date
        description: "Reporting month-end (primary key)."
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date
      - name: opening_mrr_eur
        description: "MRR at the previous month-end."
      - name: new_mrr_eur
        description: "MRR from new customers."
      - name: expansion_mrr_eur
        description: "MRR added by existing customers."
      - name: reactivation_mrr_eur
        description: "MRR from returning customers."
      - name: contraction_mrr_eur
        description: "MRR lost by customers who stay active (positive)."
      - name: churn_mrr_eur
        description: "MRR lost by customers who stopped paying (positive)."
      - name: mrr_eur
        description: "KPI 1 - MRR at the month-end (closing, paid lines only)."
        data_tests:
          - not_null
      - name: mrr_growth_yoy_pct
        description: "KPI 2 - MRR growth vs 12 months earlier, in %. NULL until 2019-11 (incomplete 2018 base)."
      - name: net_new_mrr_eur
        description: "KPI 3 - new + expansion + reactivation - contraction - churn."
        data_tests:
          - not_null
      - name: net_revenue_retention_pct
        description: >
          KPI 4 - Net revenue retention, trailing 12 months: current MRR of customers paying 12 months ago / their MRR
          then, in %. NULL until 2019-11. Lower bound (missing order lines).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: gross_revenue_retention_pct
        description: "KPI 5 - Gross revenue retention: as NRR, each customer capped at their MRR 12 months ago, in %. NULL until 2019-11. Lower bound."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: customer_churn_rate_pct
        description: "KPI 6 - Customers churned after the 1-month grace period / customers paying at the previous month-end, in %. Upper bound."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: adjusted_churn_rate_pct
        description: >
          KPI 6 leaving out churn contradicted by a still-running paid subscription (is_churn_contradicted_by_subscription),
          in %. Lower-bound estimate of the true churn rate.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: active_customers
        description: "KPI 7 - Customers with paid MRR at the month-end."
        data_tests:
          - not_null
      - name: new_logos
        description: "KPI 8 - New customers that joined within 12 months of their first paid month."
        data_tests:
          - not_null
      - name: arpu_eur
        description: "KPI 9 - MRR / active paying customers."
        data_tests:
          - not_null
      - name: cross_sell_rate_pct
        description: "KPI 10 - Share of active customers with paid MRR in more than one product category, in %."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: rpt_category_monthly
    description: >
      Category performance: one row per product category per reporting month (grain: month_end_date, product_category).
      Movements are at customer x product grain, so product swaps within a category show as churn plus new.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['month_end_date', 'product_category']
    columns:
      - name: month_end_date
        description: "Reporting month-end."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: month_end_date
      - name: product_category
        description: "Product category."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Domains', 'Hosting', 'Applications', 'Other']
      - name: mrr_eur
        description: "Category MRR at the month-end."
        data_tests:
          - not_null
      - name: active_customers
        description: "Customers with paid MRR in the category."
        data_tests:
          - not_null
      - name: gross_mrr_churn_rate_pct
        description: "MRR lost to churn this month / category MRR at the previous month-end, in %."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
